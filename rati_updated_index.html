const audio=document.querySelector('#audio'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),volume=document.querySelector('#volume'),title=document.querySelector('#title'),list=document.querySelector('#list');let selected=-1;document.querySelector('#year').textContent=new Date().getFullYear();const wave=document.querySelector('#wave');for(let i=0;i<39;i++){const e=document.createElement('i');e.style.setProperty('--h',(6+Math.round(35*Math.abs(Math.sin(i*.67)*Math.cos(i*.18))))+'px');e.style.setProperty('--d',(-i*.07)+'s');wave.append(e)}function fmt(s){if(!Number.isFinite(s))return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}function render(){list.innerHTML='';songs.forEach((s,i)=>{let row=document.createElement('div');row.className='song'+(selected===i?' active':'');let b=document.createElement('button');b.textContent=selected===i&&!audio.paused?'Ⅱ':'▶';let name=document.createElement('span');name.className='name';name.textContent=s.title;row.append(b,name);row.addEventListener('click',()=>choose(i));list.append(row)})}function choose(i){if(selected===i){toggle();return}selected=i;audio.src=songs[i].file;title.textContent=songs[i].title;audio.play().catch(()=>{});render()}function toggle(){if(selected<0){if(songs.length)choose(0);return}if(audio.paused)audio.play().catch(()=>{});else audio.pause()}play.addEventListener('click',toggle);audio.addEventListener('play',()=>{play.textContent='Ⅱ';render()});audio.addEventListener('pause',()=>{play.textContent='▶';render()});audio.addEventListener('timeupdate',()=>{document.querySelector('#current').textContent=fmt(audio.currentTime);seek.value=audio.duration?audio.currentTime/audio.duration*100:0});audio.addEventListener('loadedmetadata',()=>document.querySelector('#total').textContent=fmt(audio.duration));seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration});volume.addEventListener('input',()=>audio.volume=Number(v
