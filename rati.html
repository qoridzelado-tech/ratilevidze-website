<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#061329"><meta name="description" content="RATI LEVIDZE — Official Music Website"><title>RATI LEVIDZE | Official Music</title><style>
:root{color-scheme:dark;--bg:#061329;--blue:#102d57;--line:#7acfff;--white:#f6f9ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 40%,#13376a 0%,#071a35 42%,#041020 85%);font-family:Arial,'Noto Sans Georgian',sans-serif;color:var(--white);min-height:100vh}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-radial-gradient(ellipse at 80% 95%,transparent 0 48px,#318bdf0c 49px 51px);opacity:.65}.wrap{max-width:1300px;margin:auto;padding:24px 34px;position:relative}header{display:flex;align-items:center;justify-content:space-between;gap:20px}header .logo{font-size:clamp(20px,2.8vw,32px);letter-spacing:4px;font-weight:500}nav{display:flex;gap:28px;flex-wrap:wrap}nav a,.social a{color:#fff;text-decoration:none;font-size:14px}nav a:hover,.social a:hover{color:#77d9ff}.social{display:flex;gap:14px}.hero{display:grid;grid-template-columns:48% 52%;align-items:center;min-height:75vh}.photo{align-self:stretch;min-height:580px;position:relative;overflow:hidden;mask-image:linear-gradient(to right,black 75%,transparent 100%)}.photo img{height:100%;width:100%;object-fit:cover;object-position:50% 24%;position:absolute;inset:0;filter:saturate(.9)}.photo:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#061329 0%,transparent 28%),linear-gradient(90deg,transparent 60%,#061329 100%)}.content{padding:35px 0 35px 15px;z-index:1}h1{font-size:clamp(54px,7.5vw,112px);line-height:.9;letter-spacing:6px;margin:0;font-weight:700}h1 span{display:block}.subtitle{letter-spacing:9px;font-size:13px;margin:24px 0 12px;text-align:center}.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:54px;margin:12px auto 22px}.wave i{display:block;width:3px;height:var(--h);border-radius:3px;background:#8adfff;animation:wave 1.2s ease-in-out infinite alternate;animation-delay:var(--d);box-shadow:0 0 8px #37b9ff}@keyframes wave{to{height:5px;opacity:.6}}.player{border:1px solid #79b6e7;background:#09234acc;border-radius:17px;padding:19px 20px;box-shadow:0 0 32px #0c4c9133}.track{display:flex;align-items:center;gap:14px;margin-bottom:17px}.cover{height:58px;width:58px;border-radius:9px;background:linear-gradient(140deg,#2c77ad,#06142c 60%,#6bb7ee);display:grid;place-items:center;font-size:27px}.track strong{font-size:22px}.track small{display:block;color:#9aafc9;margin-top:5px}.controls{display:flex;align-items:center;gap:12px}.play{border:0;background:white;color:#092045;width:44px;height:44px;border-radius:50%;font-size:19px;cursor:pointer}.time{font-size:12px;min-width:35px}input[type=range]{accent-color:#91d9ff;min-width:0;flex:1;cursor:pointer}.volume{max-width:70px}.list{margin-top:15px}.song{display:flex;align-items:center;gap:13px;border-bottom:1px solid #ffffff20;padding:12px 13px;cursor:pointer;background:transparent;border-radius:8px}.song:hover,.song.active{background:#193e70}.song button{background:transparent;border:1px solid #8ca8c8;color:white;border-radius:50%;width:30px;height:30px;cursor:pointer}.song .name{flex:1}.song .duration{color:#adc4dd;font-size:12px}.hint{font-size:12px;color:#9fb4d0;margin:14px 0}footer{text-align:center;color:#8095b0;font-size:12px;padding:25px}@media(max-width:800px){.wrap{padding:19px}header{flex-wrap:wrap}.hero{display:block}.photo{height:440px;min-height:0;margin:8px -19px -120px;mask-image:none}.photo:after{background:linear-gradient(0deg,#061329 0%,transparent 70%)}.content{position:relative;padding:30px 0}h1{font-size:clamp(46px,12vw,85px);text-align:center}.subtitle{letter-spacing:5px}.volume{display:none}nav{gap:14px}.social{display:none}}
</style></head><body><div class="wrap"><header><div class="logo">RATI LEVIDZE</div><nav><a href="#home">მთავარი</a><a href="#music">სიმღერები</a><a href="#contact">კონტაქტი</a></nav></header><main id="home" class="hero"><div class="photo"><img src="portrait.jpg" alt="Rati Levidze performing on stage"></div><section class="content" id="music"><h1><span>RATI</span><span>LEVIDZE</span></h1><div class="subtitle">OFFICIAL MUSIC</div><div class="wave" aria-hidden="true" id="wave"></div><div class="player"><div class="track"><div class="cover">♫</div><div><strong id="title">მუსიკა მალე დაემატება</strong><small>RATI LEVIDZE</small></div></div><div class="controls"><button class="play" id="play" aria-label="დაკვრა">▶</button><span class="time" id="current">0:00</span><input type="range" id="seek" min="0" max="100" value="0" aria-label="სიმღერის პროგრესი"><span class="time" id="total">0:00</span><span>🔊</span><input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="ხმის დონე"></div></div><div class="list" id="list"></div><p class="hint">სიმღერებს მოგვიანებით დავამატებთ — ჯერ საიტის დიზაინს ვამზადებთ.</p></section></main><footer id="contact">© <span id="year"></span> RATI LEVIDZE · Official Music</footer></div><audio id="audio" preload="metadata"></audio><script>
const songs=[]; // Example: {title:'სიმღერის სახელი',file:'music/song.mp3'}
const audio=document.querySelector('#audio'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),volume=document.querySelector('#volume'),title=document.querySelector('#title'),list=document.querySelector('#list');let selected=-1;document.querySelector('#year').textContent=new Date().getFullYear();const wave=document.querySelector('#wave');for(let i=0;i<39;i++){const e=document.createElement('i');e.style.setProperty('--h',(6+Math.round(35*Math.abs(Math.sin(i*.67)*Math.cos(i*.18))))+'px');e.style.setProperty('--d',(-i*.07)+'s');wave.append(e)}function fmt(s){if(!Number.isFinite(s))return '0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}function render(){list.innerHTML='';songs.forEach((s,i)=>{let row=document.createElement('div');row.className='song'+(selected===i?' active':'');let b=document.createElement('button');b.textContent=selected===i&&!audio.paused?'Ⅱ':'▶';let name=document.createElement('span');name.className='name';name.textContent=s.title;row.append(b,name);row.addEventListener('click',()=>choose(i));list.append(row)})}function choose(i){if(selected===i){toggle();return}selected=i;audio.src=songs[i].file;title.textContent=songs[i].title;audio.play().catch(()=>{});render()}function toggle(){if(selected<0){if(songs.length)choose(0);return}if(audio.paused)audio.play().catch(()=>{});else audio.pause()}play.addEventListener('click',toggle);audio.addEventListener('play',()=>{play.textContent='Ⅱ';render()});audio.addEventListener('pause',()=>{play.textContent='▶';render()});audio.addEventListener('timeupdate',()=>{document.querySelector('#current').textContent=fmt(audio.currentTime);seek.value=audio.duration?audio.currentTime/audio.duration*100:0});audio.addEventListener('loadedmetadata',()=>document.querySelector('#total').textContent=fmt(audio.duration));seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration});volume.addEventListener('input',()=>audio.volume=Number(volume.value));audio.volume=.8;audio.addEventListener('ended',()=>{if(selected+1<songs.length)choose(selected+1)});render();
</script></body></html>
